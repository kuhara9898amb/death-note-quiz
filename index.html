<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>デスノート検定 上級編</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at top, rgba(120,0,0,.25), transparent 35%),
    linear-gradient(135deg, #050505, #111 45%, #020202);
  color: #f5f5f5;
  font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
}

.container {
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  padding: 22px 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.notebook {
  width: 100%;
  min-height: 620px;
  padding: 26px 22px;
  position: relative;
  background:
    linear-gradient(90deg, rgba(255,255,255,.03) 0 1px, transparent 1px 100%),
    linear-gradient(#070707, #101010);
  background-size: 28px 100%, 100% 100%;
  border-radius: 10px;
  border: 2px solid #222;
  box-shadow:
    0 30px 70px rgba(0,0,0,.9),
    inset 0 0 35px rgba(255,255,255,.04),
    inset 0 0 0 1px rgba(255,255,255,.05);
  overflow: hidden;
}

.notebook::before {
  content: "";
  position: absolute;
  left: 14px;
  top: 0;
  width: 4px;
  height: 100%;
  background: linear-gradient(#222, #555, #111);
  opacity: .8;
}

.screen {
  position: relative;
  z-index: 2;
  min-height: 560px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.death {
  font-size: 15px;
  text-align: center;
  letter-spacing: 5px;
  margin-bottom: 8px;
  color: #b91c1c;
  font-family: Georgia, serif;
}

h1 {
  margin: 0;
  text-align: center;
  font-size: 36px;
  letter-spacing: 4px;
  color: #eee;
  text-shadow: 0 0 12px rgba(255,0,0,.45), 2px 2px 0 #000;
}

.subtitle {
  text-align: center;
  color: #aaa;
  margin: 22px 0 32px;
  font-size: 14px;
  line-height: 1.8;
}

.rule {
  border-top: 1px solid #333;
  border-bottom: 1px solid #333;
  padding: 14px 0;
  margin: 22px 0;
  color: #bbb;
  font-size: 13px;
  line-height: 1.8;
}

.btn {
  width: 100%;
  padding: 16px;
  margin-top: 14px;
  border: 1px solid #7f1d1d;
  border-radius: 2px;
  background: linear-gradient(#991b1b, #450a0a);
  color: #fff;
  font-size: 17px;
  font-weight: bold;
  letter-spacing: 2px;
  font-family: inherit;
}

.btn.secondary {
  background: #151515;
  border-color: #444;
}

.question-count {
  color: #b91c1c;
  font-weight: bold;
  margin-bottom: 18px;
  letter-spacing: 2px;
}

.question {
  font-size: 20px;
  line-height: 1.75;
  margin-bottom: 24px;
  border-left: 3px solid #7f1d1d;
  padding-left: 14px;
}

.choice {
  width: 100%;
  background: rgba(20,20,20,.92);
  color: #eee;
  border: 1px solid #3a3a3a;
  padding: 15px 14px;
  margin-bottom: 12px;
  font-size: 16px;
  text-align: left;
  font-family: inherit;
}

.choice::before {
  content: "✦";
  color: #7f1d1d;
  margin-right: 8px;
}

.correct {
  background: #12351f !important;
  border-color: #22c55e !important;
}

.wrong {
  background: #451313 !important;
  border-color: #ef4444 !important;
}

.score {
  font-size: 56px;
  text-align: center;
  font-weight: bold;
  margin: 26px 0 10px;
  color: #b91c1c;
  font-family: Georgia, serif;
}

.rank {
  text-align: center;
  font-size: 26px;
  font-weight: bold;
  margin-bottom: 20px;
  letter-spacing: 2px;
}

.message {
  text-align: center;
  color: #ccc;
  line-height: 1.9;
  margin-bottom: 26px;
  font-size: 15px;
}

.hidden { display: none; }
</style>
</head>

<body>
<div class="container">
  <div class="notebook">

    <div id="startScreen" class="screen">
      <div class="death">DEATH NOTE</div>
      <h1>上級検定</h1>
      <div class="subtitle">
        この問題、正解できる者は少ない。<br>
        真の記憶力が試される。
      </div>

      <div class="rule">
        ・10問4択<br>
        ・全問正解で「デスノートマスター」<br>
        ・今回はかなり難しめ
      </div>

      <button class="btn" onclick="startQuiz()">検定開始</button>
    </div>

    <div id="quizScreen" class="screen hidden">
      <div class="question-count" id="questionCount"></div>
      <div class="question" id="questionText"></div>
      <div id="choices"></div>
    </div>

    <div id="resultScreen" class="screen hidden">
      <div class="death">RESULT</div>
      <h1>審判完了</h1>
      <div class="score" id="scoreText"></div>
      <div class="rank" id="rankText"></div>
      <div class="message" id="messageText"></div>

      <button class="btn" onclick="shareResult()">Xで結果をシェア</button>
      <button class="btn secondary" onclick="restartQuiz()">もう一度挑戦</button>
    </div>

  </div>
</div>

<script>
const questions = [
  {
    question: "Lがキラ捜査本部で名乗っていた名前は？",
    choices: ["流河旱樹", "竜崎", "渡", "朝日月"],
    answer: 1
  },
  {
    question: "ワタリの本名は？",
    choices: ["クイルシュ・ワイミー", "キルシュ・ワイミー", "ロジャー・ワイミー", "アルフレッド・ワイミー"],
    answer: 0
  },
  {
    question: "デスノートに死因を書かなかった場合、基本的に何秒後に心臓麻痺で死ぬ？",
    choices: ["20秒", "30秒", "40秒", "60秒"],
    answer: 2
  },
  {
    question: "夜神月がポテトチップスの袋に隠していたものは？",
    choices: ["小型カメラ", "超小型テレビ", "盗聴器", "ICレコーダー"],
    answer: 1
  },
  {
    question: "シブタクの本名は？",
    choices: ["渋井丸拓男", "渋谷拓海", "渋田卓郎", "渋川拓也"],
    answer: 0
  },
  {
    question: "魅上照がキラを何と呼んでいた？",
    choices: ["救世主", "新世界の王", "神", "絶対正義"],
    answer: 2
  },
  {
    question: "ニアが所属していた組織は？",
    choices: ["SPK", "FBI", "ICPO", "CIA"],
    answer: 0
  },
  {
    question: "メロが好んで食べていたものは？",
    choices: ["キャンディ", "チョコレート", "ドーナツ", "リンゴ"],
    answer: 1
  },
  {
    question: "死神ジェラスが命を落とした理由は？",
    choices: ["デスノートを盗まれた", "人間を救った", "寿命が尽きた", "リュークに殺された"],
    answer: 1
  },
  {
    question: "死神の目の取引で得られる能力は？",
    choices: ["相手の名前と寿命が見える", "相手の心が読める", "未来が見える", "死神を操れる"],
    answer: 0
  }
];

let currentQuestion = 0;
let score = 0;
let answered = false;

function startQuiz() {
  currentQuestion = 0;
  score = 0;
  answered = false;

  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("resultScreen").classList.add("hidden");
  document.getElementById("quizScreen").classList.remove("hidden");

  showQuestion();
}

function showQuestion() {
  answered = false;

  const q = questions[currentQuestion];

  document.getElementById("questionCount").textContent =
    `Question ${currentQuestion + 1} / ${questions.length}`;

  document.getElementById("questionText").textContent = q.question;

  const choicesDiv = document.getElementById("choices");
  choicesDiv.innerHTML = "";

  q.choices.forEach((choice, index) => {
    const button = document.createElement("button");
    button.className = "choice";
    button.textContent = choice;
    button.onclick = () => selectAnswer(index, button);
    choicesDiv.appendChild(button);
  });
}

function selectAnswer(selectedIndex, button) {
  if (answered) return;
  answered = true;

  const q = questions[currentQuestion];
  const buttons = document.querySelectorAll(".choice");

  if (selectedIndex === q.answer) {
    score++;
    button.classList.add("correct");
  } else {
    button.classList.add("wrong");
    buttons[q.answer].classList.add("correct");
  }

  setTimeout(() => {
    currentQuestion++;

    if (currentQuestion < questions.length) {
      showQuestion();
    } else {
      showResult();
    }
  }, 850);
}

function showResult() {
  document.getElementById("quizScreen").classList.add("hidden");
  document.getElementById("resultScreen").classList.remove("hidden");

  document.getElementById("scoreText").textContent = `${score}/10`;

  let rank = "";
  let message = "";

  if (score === 10) {
    rank = "デスノートマスター";
    message = "完全正解。あなたの記憶力はL級を超えています。";
  } else if (score >= 8) {
    rank = "キラ捜査本部 上級分析官";
    message = "かなり強いです。普通のファンではここまで取れません。";
  } else if (score >= 6) {
    rank = "L級観察者";
    message = "十分すごいです。ただ、まだノートの奥は深い。";
  } else if (score >= 3) {
    rank = "捜査本部見習い";
    message = "記憶の断片は残っています。もう一度挑戦しましょう。";
  } else {
    rank = "初心者死神";
    message = "リュークがリンゴをかじりながら笑っています。";
  }

  document.getElementById("rankText").textContent = rank;
  document.getElementById("messageText").textContent = message;
}

function restartQuiz() {
  startQuiz();
}

function shareResult() {
  const rank = document.getElementById("rankText").textContent;
  const text = `デスノート上級検定で${score}/10点でした。\n称号：${rank}\n#デスノート検定`;
  const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
  window.open(url, "_blank");
}
</script>
</body>
</html>
